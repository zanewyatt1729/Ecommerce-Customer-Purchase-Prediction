
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purchase Prediction Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #173b70;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card, .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .card h3 {
            color: #64748b;
            margin-top: 0;
        }

        .card p {
            font-size: 32px;
            font-weight: bold;
            color: #173b70;
            margin-bottom: 0;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .chart-card h2 {
            font-size: 19px;
            color: #173b70;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 18px;
            background: #173b70;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        @media(max-width: 700px) {
            .cards, .charts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Purchase Prediction Analytics</h1>

    <p class="subtitle">
        Overview of predictions recorded by the machine learning application.
    </p>

    <!-- SUMMARY CARDS -->

    <div class="cards">

        <div class="card">
            <h3>Total Predictions</h3>
            <p>{{ total }}</p>
        </div>

        <div class="card">
            <h3>Purchase Likely</h3>
            <p>{{ likely_purchases }}</p>
        </div>

    </div>


    <!-- CHARTS -->

    <div class="charts">

        <div class="chart-card">
            <h2>Prediction Distribution</h2>
            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h2>Monthly Prediction Activity</h2>
            <div class="chart-container">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h2>Visitor Type Distribution</h2>
            <div class="chart-container">
                <canvas id="visitorChart"></canvas>
            </div>
        </div>

    </div>

    <a href="/" class="back-link">
        Back to Prediction Form
    </a>

</div>


<script>

    // Prediction distribution data
    const predictionLabels = {{ prediction_labels | tojson }};
    const predictionCounts = {{ prediction_counts | tojson }};

    new Chart(document.getElementById("predictionChart"), {
        type: "doughnut",

        data: {
            labels: predictionLabels,
            datasets: [{
                data: predictionCounts,
                backgroundColor: ["#2563eb", "#f59e0b"]
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });


    // Monthly activity data
    const monthLabels = {{ month_labels | tojson }};
    const monthCounts = {{ month_counts | tojson }};

    new Chart(document.getElementById("monthlyChart"), {
        type: "bar",

        data: {
            labels: monthLabels,
            datasets: [{
                label: "Number of Predictions",
                data: monthCounts,
                backgroundColor: "#2563eb"
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });


    // Visitor type data
    const visitorLabels = {{ visitor_labels | tojson }};
    const visitorCounts = {{ visitor_counts | tojson }};

    new Chart(document.getElementById("visitorChart"), {
        type: "pie",

        data: {
            labels: visitorLabels,
            datasets: [{
                data: visitorCounts,
                backgroundColor: [
                    "#2563eb",
                    "#10b981",
                    "#f59e0b"
                ]
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

</script>

</body>
</html>
